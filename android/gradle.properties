org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Network is slow reaching plugins.gradle.org / Maven Central — raise the
# timeouts well above Gradle's 30s default so slow downloads can complete.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000

# Keep the Gradle daemon alive and retry transient network failures.
org.gradle.daemon=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
